[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-capability-runner"
version = "0.1.0"
description = "Discover once, replay deterministically against legacy user interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openai>=1.50",
    "playwright>=1.48",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
interface-automation = "interface_automation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
